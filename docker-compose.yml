services:
  app:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Dev mode: mounts src/ so you can edit files and just refresh the browser
  # Usage: docker compose --profile dev up
  app-dev:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html
    profiles: [dev]
